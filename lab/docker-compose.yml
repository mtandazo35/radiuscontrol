name: radiuscontrol-lab

services:
  freeradius:
    image: freeradius/freeradius-server:${FREERADIUS_TAG:-latest-3.2}
    container_name: radiuscontrol-freeradius
    # Red del host: FreeRADIUS debe ver la IP de origen real de cada router.
    network_mode: host
    restart: unless-stopped
    command: ["-f", "-l", "stdout"]
    volumes:
      - ./generado/clients.conf:${RADDB:-/etc/raddb}/clients.conf:ro
      - ./generado/authorize:${RADDB:-/etc/raddb}/mods-config/files/authorize:ro
